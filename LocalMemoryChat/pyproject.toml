[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-memory-chat"
version = "0.0.1"
description = "Local RAG and chat memory packet prototype"
requires-python = ">=3.11"

[project.scripts]
local-memory-chat = "local_memory_chat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
