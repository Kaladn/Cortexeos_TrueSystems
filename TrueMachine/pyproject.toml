[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "truemachine"
version = "0.1.0"
description = "Linux temporal machine-state observation and fusion"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
truemachine = "truemachine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
