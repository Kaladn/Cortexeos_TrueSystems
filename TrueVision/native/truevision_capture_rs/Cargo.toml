[package]
name = "truevision_capture_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
ashpd = { version = "0.13.13", features = ["screencast"] }
enumflags2 = "0.7"
gstreamer = "0.25.0"
gstreamer-app = "0.25.0"
gstreamer-video = "0.25.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
time = { version = "0.3", features = ["formatting", "macros"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
