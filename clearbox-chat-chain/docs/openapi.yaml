openapi: 3.1.0
info: {title: Clearbox Chat-Chain API, version: 0.1.0}
servers: [{url: 'http://127.0.0.1:3219'}]
paths:
  /health:
    get: {responses: {'200': {description: Healthy}}}
  /api/v1/conversations:
    get: {responses: {'200': {description: Conversation list}}}
    post:
      requestBody: {content: {application/json: {schema: {type: object, properties: {title: {type: string}}}}}}
      responses: {'201': {description: Created}}
  /api/v1/conversations/{conversation_id}:
    get: {parameters: [{$ref: '#/components/parameters/conversationId'}], responses: {'200': {description: Projection}}}
  /api/v1/conversations/{conversation_id}/attachments:
    get:
      summary: List immutable external attachment references
      parameters:
        - {$ref: '#/components/parameters/conversationId'}
        - name: branch_id
          in: query
          required: false
          description: When supplied, returns only attachments visible on this branch.
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Deterministic creation-order attachment projections
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AttachmentProjection'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      summary: Persist a validated Clearbox v1 Chain attachment reference
      parameters: [{$ref: '#/components/parameters/conversationId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateAttachmentCommand'}}}
      responses:
        '201':
          description: Created, or the original projection for an identical idempotent replay
          content: {application/json: {schema: {$ref: '#/components/schemas/AttachmentProjection'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: Unsupported attachment contract schema or version
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/attachments/{attachment_id}:
    get:
      summary: Read one persisted external attachment reference
      parameters:
        - name: attachment_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Attachment projection
          content: {application/json: {schema: {$ref: '#/components/schemas/AttachmentProjection'}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/conversations/{conversation_id}/turns:
    post:
      parameters: [{$ref: '#/components/parameters/conversationId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SendTurn'}}}}
      responses: {'202': {description: Accepted}, '409': {description: Revision conflict}}
  /api/v1/branches/{branch_id}:
    get: {parameters: [{name: branch_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Branch projection}}}
  /api/v1/turns/{turn_id}:
    get: {parameters: [{$ref: '#/components/parameters/turnId'}], responses: {'200': {description: Turn projection}}}
  /api/v1/turns/{turn_id}/cancel:
    post: {parameters: [{$ref: '#/components/parameters/turnId'}], responses: {'202': {description: Cancellation requested}}}
  /api/v1/outputs/{output_id}/continue:
    post: {parameters: [{name: output_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'202': {description: Accepted}}}
  /api/v1/messages/{message_id}/branch:
    post: {parameters: [{name: message_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'202': {description: Accepted}}}
  /api/v1/models:
    get: {responses: {'200': {description: Adapters and model hints}}}
  /api/v1/events:
    get: {parameters: [{name: after, in: query, schema: {type: integer, minimum: 0}}], responses: {'200': {description: Durable event feed}}}
components:
  responses:
    ValidationError:
      description: Contract, command, placement, hash, reference, or field validation failed before persistence
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Conversation/revision, idempotency, attachment ID, or immutable identity conflict
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: Conversation, branch, placement target, or attachment not found
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  parameters:
    conversationId: {name: conversation_id, in: path, required: true, schema: {type: string, format: uuid}}
    turnId: {name: turn_id, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
    CreateAttachmentCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, expected_branch_revision, attachment]
      properties:
        idempotency_key: {type: string, minLength: 1}
        expected_branch_revision: {type: integer, minimum: 0}
        attachment:
          $ref: '../../ClearboxAI-V2.5/contracts/v1/schemas/chain-attachment.schema.json'
    AttachmentPlacement:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, branch_id]
          properties:
            kind: {const: conversation}
            branch_id: {type: string, format: uuid}
        - type: object
          additionalProperties: false
          required: [kind, branch_id, target_id]
          properties:
            kind: {enum: [message, model_output]}
            branch_id: {type: string, format: uuid}
            target_id: {type: string, format: uuid}
    AttachmentProjection:
      type: object
      additionalProperties: false
      required: [sequence, created_at, placement, attachment]
      properties:
        sequence: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        placement: {$ref: '#/components/schemas/AttachmentPlacement'}
        attachment:
          $ref: '../../ClearboxAI-V2.5/contracts/v1/schemas/chain-attachment.schema.json'
    Seat: {type: object, required: [provider, model], properties: {provider: {type: string}, model: {type: string}}}
    Plan: {type: object, required: [mode, seats], properties: {mode: {enum: [single, chain]}, seats: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Seat'}}}}
    SendTurn:
      type: object
      required: [branch_id, content, plan, expected_branch_revision, idempotency_key]
      properties:
        branch_id: {type: string, format: uuid}
        content: {type: string, minLength: 1}
        plan: {$ref: '#/components/schemas/Plan'}
        expected_branch_revision: {type: integer}
        idempotency_key: {type: string, minLength: 1}
