openapi: 3.1.0
info: {title: TrueSystems Chat-Chain API, version: 0.2.0}
servers: [{url: 'http://127.0.0.1:3219'}]
paths:
  /:
    get: {summary: Display the local chat entry surface, responses: {'200': {description: HTML surface}}}
  /health:
    get: {responses: {'200': {description: Healthy}}}
  /api/v1/models:
    get: {summary: List routable provider and model identities, responses: {'200': {description: Model routes}}}
  /api/v1/identities:
    get: {summary: List durable participant identities, responses: {'200': {description: Identities}}}
  /api/v1/conversations:
    get: {responses: {'200': {description: Conversation list}}}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string}
                calendar_day: {type: string, format: date}
      responses: {'201': {description: Created}}
  /api/v1/days/{calendar_day}:
    parameters:
      - {name: calendar_day, in: path, required: true, schema: {type: string, format: date}}
    get: {summary: Get or create the unique chat for a calendar day, responses: {'200': {description: Daily chat projection}}}
    post: {summary: Get or create the unique chat for a calendar day, responses: {'200': {description: Daily chat projection}}}
  /api/v1/conversations/{conversation_id}:
    get: {parameters: [{$ref: '#/components/parameters/conversationId'}], responses: {'200': {description: Conversation projection}}}
  /api/v1/conversations/{conversation_id}/turns:
    post:
      parameters: [{$ref: '#/components/parameters/conversationId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SendTurn'}}}}
      responses: {'202': {description: Accepted}, '409': {description: Revision conflict}}
  /api/v1/branches/{branch_id}:
    get:
      parameters: [{name: branch_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Branch and identity-bearing message projection}}
  /api/v1/turns/{turn_id}:
    get: {parameters: [{$ref: '#/components/parameters/turnId'}], responses: {'200': {description: Turn and identity-bearing outputs}}}
  /api/v1/turns/{turn_id}/cancel:
    post: {parameters: [{$ref: '#/components/parameters/turnId'}], responses: {'202': {description: Cancellation requested}}}
  /api/v1/outputs/{output_id}/continue:
    post:
      parameters: [{name: output_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'202': {description: Continued on a child branch}}
  /api/v1/messages/{message_id}/branch:
    post:
      parameters: [{name: message_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'202': {description: Branched}}
  /api/v1/events:
    get:
      parameters: [{name: after, in: query, schema: {type: integer, minimum: 0}}]
      responses: {'200': {description: Durable event feed}}
components:
  parameters:
    conversationId: {name: conversation_id, in: path, required: true, schema: {type: string, format: uuid}}
    turnId: {name: turn_id, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    Seat:
      type: object
      required: [provider, model]
      properties: {provider: {type: string}, model: {type: string}}
    Plan:
      type: object
      required: [mode, seats]
      properties:
        mode: {enum: [single, chain]}
        seats: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Seat'}}
    SendTurn:
      type: object
      required: [branch_id, content, plan, expected_branch_revision, idempotency_key]
      properties:
        branch_id: {type: string, format: uuid}
        content: {type: string, minLength: 1}
        plan: {$ref: '#/components/schemas/Plan'}
        expected_branch_revision: {type: integer, minimum: 0}
        idempotency_key: {type: string, minLength: 1}
